<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100c"><title>Admin — APK Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#f4ecdf;--ink:#2a2118;--mut:#7d6f5f;--card:rgba(255,251,243,.92);--line:rgba(60,40,20,.14);--acc:#2f7d5b;--acc2:#e8a33d;--shadow:0 18px 50px rgba(40,25,10,.25)}
body.night{--bg:#0d1224;--ink:#ece6d8;--mut:#9aa1b8;--card:rgba(20,26,48,.9);--line:rgba(255,255,255,.12);--acc:#5fc79a;--shadow:0 18px 50px rgba(0,0,0,.5)}
body.evening{--bg:#3a2218;--ink:#fbeedd;--mut:#d0b7a2;--card:rgba(58,34,24,.9);--line:rgba(255,220,180,.16);--acc:#f0b562}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#14100c;color:var(--ink);font-family:"DM Sans","Noto Sans Bengali",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
#top{position:fixed;left:16px;right:16px;top:14px;display:flex;gap:10px;align-items:center;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:999px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px 0 42px;font:inherit;outline:none;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:14px;top:12px;width:20px;height:20px;opacity:.55}
.sugg{position:absolute;top:50px;left:0;right:0;border-radius:16px;overflow:hidden;display:none}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px}
.sugg button:hover,.sugg button.on{background:rgba(127,127,127,.15)}
.sugg img{width:30px;height:30px;border-radius:8px;object-fit:cover}
.sp{flex:1}
.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.ibtn.on{background:var(--acc);color:#fff}
#chips{position:fixed;left:16px;right:16px;top:70px;display:flex;gap:8px;overflow-x:auto;z-index:4;padding:4px 0;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px)}
.chip.on{background:var(--ink);color:var(--bg)}
#presets{position:fixed;left:16px;bottom:16px;display:flex;gap:6px;z-index:4;padding:5px;border-radius:999px}
#presets button{padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mut)}
#presets button.on{background:var(--ink);color:var(--bg)}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:12.5px;color:#fff;background:rgba(0,0,0,.45);padding:7px 14px;border-radius:999px;z-index:3;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#tip{position:fixed;z-index:6;pointer-events:none;padding:7px 11px;border-radius:12px;font-size:12.5px;font-weight:600;transform:translate(-50%,-130%);opacity:0;transition:opacity .15s;white-space:nowrap}
#tip small{display:block;font-weight:400;color:var(--mut)}
/* details */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:7;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-radius:24px 0 0 24px;border-right:0}
#panel.open{transform:none}
#panel .scroll{overflow-y:auto;flex:1;padding:18px 22px 110px;overscroll-behavior:contain}
.pclose{position:absolute;top:12px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(127,127,127,.18);font-size:18px}
.phead{display:flex;gap:16px;align-items:flex-end;margin-top:6px}
.phead img{width:92px;height:92px;border-radius:24px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.phead h2{font-size:24px;line-height:1.1;margin-bottom:4px}
.phead .dev{color:var(--acc);font-weight:600;font-size:13.5px}
.phead .tg{color:var(--mut);font-size:13px;margin-top:2px}
.stats{display:flex;margin:18px 0;padding:12px 0;border-block:1px solid var(--line)}
.stats div{flex:1;text-align:center;border-left:1px solid var(--line);padding:0 4px}
.stats div:first-child{border:0}
.stats b{display:block;font-size:15px}.stats span{font-size:11.5px;color:var(--mut)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(127,127,127,.16)}
.badge.g{background:var(--acc);color:#fff}.badge.o{background:var(--acc2);color:#2a1a05}
.shots{display:flex;gap:10px;overflow-x:auto;margin:0 -22px;padding:4px 22px 10px;scroll-snap-type:x mandatory}
.shots img{height:260px;width:auto;border-radius:16px;scroll-snap-align:start;cursor:zoom-in;box-shadow:0 6px 18px rgba(0,0,0,.2);background:rgba(127,127,127,.15)}
.sec{margin-top:22px}.sec h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sec p,.sec li{font-size:14px;line-height:1.55;color:var(--ink);opacity:.9}
.sec ul{padding-left:18px}
.more{font-size:13px;color:var(--acc);font-weight:700}
.rate{display:flex;gap:18px;align-items:center}
.rate .big{font-size:46px;font-weight:700;line-height:1}
.bars{flex:1}.bars div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.bars i{flex:1;height:6px;border-radius:9px;background:rgba(127,127,127,.2);overflow:hidden}.bars u{display:block;height:100%;background:var(--acc);border-radius:9px}
.rev{padding:12px 0;border-bottom:1px solid var(--line)}
.rev .h{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.rev .h span{color:var(--mut);font-weight:400}
.stars{color:var(--acc2);letter-spacing:1px}
.write textarea,.write input{width:100%;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:rgba(127,127,127,.1);color:var(--ink);padding:10px;font:inherit}
.starpick button{font-size:26px;color:rgba(127,127,127,.4)}.starpick button.on{color:var(--acc2)}
.btn{padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;background:rgba(127,127,127,.18)}
.btn.main{background:var(--acc);color:#fff}
.info{width:100%;border-collapse:collapse;font-size:13.5px}.info td{padding:7px 0;border-bottom:1px solid var(--line)}.info td:first-child{color:var(--mut);width:42%}
.perm{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border-radius:10px;background:rgba(127,127,127,.15);font-size:12.5px}
.sim{display:flex;gap:12px;overflow-x:auto}.sim button{flex:0 0 76px;text-align:center;font-size:11.5px}.sim img{width:68px;height:68px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 4px}
#bar{position:absolute;left:0;right:0;bottom:0;padding:14px 22px 18px;display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,var(--card) 35%);border-radius:0 0 0 24px}
#bar .inst{flex:1;height:50px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;position:relative;overflow:hidden}
#bar .inst.done{background:rgba(127,127,127,.25);color:var(--ink)}
#bar .inst i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);width:0}
#bar .sq{width:50px;height:50px;border-radius:50%;background:rgba(127,127,127,.2);font-size:20px}
#bar .sq.on{background:#e0457b;color:#fff}
/* list view */
#list{position:fixed;inset:0;z-index:3;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(22px);display:none;overflow-y:auto;padding:130px 22px 90px}
#list.show{display:block}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;gap:14px;padding:14px;border-radius:20px;text-align:left;align-items:center;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card img{width:68px;height:68px;border-radius:18px;object-fit:cover;flex:none}
.card b{display:block;font-size:15px}.card span{display:block;font-size:12.5px;color:var(--mut)}
.sortbar{max-width:1100px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sortbar select{border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;font:inherit}
.empty{text-align:center;color:var(--mut);padding:60px 0;grid-column:1/-1}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);opacity:0;z-index:20;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.3s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:none;place-items:center}#lb.show{display:grid}#lb img{max-width:92vw;max-height:88vh;border-radius:18px}
#boot{position:fixed;inset:0;z-index:50;background:#14100c;color:#f0e4cf;display:grid;place-items:center;text-align:center;transition:opacity .8s}
#boot .ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#e8a33d;animation:sp 1s linear infinite;margin:0 auto 14px}@keyframes sp{to{rotate:360deg}}
@media(max-width:720px){
 #top{left:10px;right:10px;top:10px;gap:6px;flex-wrap:wrap}.logo span{display:none}.logo{padding:6px}.search{order:3;flex:1 0 100%;max-width:none}.sp{display:none}.search input{height:40px}.search svg{top:10px}
 .seg button{padding:7px 9px;font-size:12px}.ibtn{width:38px;height:38px;font-size:16px}.logo i{margin:0}#top{justify-content:space-between}.search+.seg{margin-left:0}
 #chips{top:112px;left:10px;right:10px}
 #panel{top:auto;height:64vh;width:100%;border-radius:24px 24px 0 0;transform:translateY(105%)}#panel.open{transform:none}#bar{border-radius:0}
 #presets{left:10px;bottom:10px;max-width:calc(100vw - 20px);overflow-x:auto}#hint{display:none}
 #list{padding-top:170px}
}
/* ---------- account menu ---------- */
#me{font-weight:700;font-size:15px;background:var(--card)}#me.in{background:var(--acc);color:#fff}
#menu{position:fixed;top:66px;right:16px;z-index:12;width:min(300px,calc(100vw - 20px));border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
#menu[hidden]{display:none}
#menu .who{padding:4px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}#menu .who b{display:block;font-size:15px}#menu .who span{font-size:12.5px;color:var(--mut);word-break:break-all}
#menu button,#menu a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 10px;border-radius:12px;font-size:14px;font-weight:600;text-align:left;text-decoration:none;color:var(--ink)}
#menu button:hover,#menu a:hover{background:rgba(127,127,127,.15)}#menu small{color:var(--mut);font-weight:500}
#menu .seg2{display:flex;gap:4px;padding:2px 4px 6px}#menu .seg2 button{flex:1;justify-content:center;padding:8px 4px;font-size:12.5px;border:1px solid var(--line)}#menu .seg2 button.on{background:var(--acc);color:#fff;border-color:transparent}
#menu .lbl{font-size:11.5px;color:var(--mut);padding:6px 10px 0;font-weight:600;letter-spacing:.3px}
/* ---------- auth card ---------- */
.av-wrap{display:grid;place-items:center;min-height:100%;padding:20px;color:var(--ink)}
.av-overlay{position:fixed;inset:0;z-index:40;background:rgba(10,8,6,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto}
.av-overlay[hidden]{display:none}
.av-card{width:min(400px,100%);border-radius:28px;padding:26px 22px 20px;text-align:center}
.av-logo i{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 10px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-style:normal;font-size:28px}
.av-title{font-size:25px;margin-bottom:4px}.av-sub{color:var(--mut);font-size:13.5px;line-height:1.45;margin-bottom:14px}
.av-tabs{display:flex;background:rgba(127,127,127,.15);border-radius:999px;padding:4px;margin-bottom:14px}.av-tabs button{flex:1;padding:9px;border-radius:999px;font-weight:700;font-size:14px;color:var(--mut)}.av-tabs button.on{background:var(--acc);color:#fff}
.av-f{display:block;text-align:left;margin-bottom:10px}.av-f span{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:4px}
.av-f input,.av-pw input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(127,127,127,.1);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;outline:none}
.av-f input:focus,.av-pw input:focus{border-color:var(--acc);background:rgba(127,127,127,.06)}
.av-pw{position:relative}.av-pw input{padding-right:64px}.av-pw button{position:absolute;right:6px;top:7px;height:32px;padding:0 10px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--acc)}
.av-err{display:none;text-align:left;font-size:13px;color:#e0455b;background:rgba(224,69,91,.12);border-radius:12px;padding:9px 12px;margin-bottom:10px;line-height:1.4}
.av-main{width:100%;height:50px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}.av-main.busy{opacity:.6}.av-main:disabled{cursor:wait}
.av-link{margin-top:12px;color:var(--acc);font-weight:600;font-size:13.5px}
.av-or{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--mut);font-size:12px}.av-or:before,.av-or:after{content:"";flex:1;height:1px;background:var(--line)}
.av-alt{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(127,127,127,.08)}.av-alt b{color:#4285f4;font-size:17px}
.av-alt.ghost{border-color:transparent;color:var(--mut)}
.av-demo{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.4}
.av-prog{position:relative;height:30px;border-radius:999px;background:rgba(127,127,127,.15);overflow:hidden;margin-top:14px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mut)}.av-prog[hidden]{display:none}
.av-prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(95,199,154,.35);transition:width .3s}.av-prog span{position:relative}
/* ---------- admin ---------- */
.ad-overlay{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto}.ad-overlay[hidden]{display:none}
body.adminpage{overflow:auto;background:var(--bg)}
.ad-root{max-width:720px;margin:0 auto;padding:12px 14px 90px;color:var(--ink);min-height:100%;position:relative}
.ad-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;position:sticky;top:8px;z-index:5;flex-wrap:wrap}.ad-head small{display:block;color:var(--mut);font-size:12px}
.ad-row{display:flex;gap:8px}.ad-col{display:flex;flex-direction:column;gap:6px}
.btn.danger{background:rgba(224,69,91,.16);color:#e0455b}
.ad-tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}.ad-tabs button{padding:10px 14px;border-radius:999px;font-weight:700;font-size:13.5px;white-space:nowrap;background:var(--card);border:1px solid var(--line)}.ad-tabs button.on{background:var(--ink);color:var(--bg)}
.ad-app{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;margin-bottom:10px}.ad-app img{width:58px;height:58px;border-radius:15px;object-fit:cover;flex:none}.ad-info{flex:1;min-width:0}.ad-info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ad-info span{display:block;font-size:12.5px;color:var(--mut)}
.ad-empty{text-align:center;padding:30px 16px;border-radius:20px}.ad-empty p{margin-bottom:12px;color:var(--mut)}
.ad-card{border-radius:20px;padding:16px;margin-bottom:12px}.ad-card h3{font-size:16px;margin-bottom:10px}.ad-card h3 small{color:var(--mut);font-weight:500;font-size:12px}
.ad-f{display:block;margin-bottom:10px}.ad-f span{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:4px}
.ad-f input,.ad-f textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:rgba(127,127,127,.1);color:var(--ink);padding:11px 12px;font:inherit;font-size:16px;outline:none}.ad-f input[type=color]{padding:3px;height:46px}.ad-f input:focus,.ad-f textarea:focus{border-color:var(--acc)}
.ad-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ad-grow{flex:1;min-width:0}
.ad-iconrow{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.ad-icon{width:96px;height:96px;flex:none;border-radius:24px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mut);cursor:pointer;overflow:hidden}.ad-icon img{width:100%;height:100%;object-fit:cover}
.ad-shots{display:flex;gap:10px;flex-wrap:wrap}.ad-th{position:relative}.ad-th img{height:110px;border-radius:12px;display:block}.ad-th button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:#e0455b;color:#fff;font-size:16px;line-height:1}
.ad-add{width:70px;height:110px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-size:26px;color:var(--mut);cursor:pointer}
.ad-seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.ad-seg button{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--line)}.ad-seg button.on{background:var(--acc);color:#fff;border-color:transparent}
.ad-file{display:block;padding:18px;border-radius:14px;border:2px dashed var(--line);text-align:center;font-weight:600;cursor:pointer;margin-bottom:10px;word-break:break-all}
.ad-chk{display:flex;gap:10px;align-items:center;font-weight:600;padding:6px 0}.ad-chk input{width:22px;height:22px}
.ad-mut{color:var(--mut);font-size:13px;line-height:1.5;margin-bottom:8px}.ad-warn{color:#c9822a;font-size:13px;margin-bottom:8px}
.ad-save{position:sticky;bottom:10px;display:flex;gap:10px;z-index:4}.ad-save .btn{flex:1;height:50px;font-size:15px}
.ad-prog{position:relative;height:34px;border-radius:999px;background:rgba(127,127,127,.2);overflow:hidden;margin:6px 0 12px;display:grid;place-items:center;font-size:13px;font-weight:700}.ad-prog[hidden]{display:none}.ad-prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(95,199,154,.5);transition:width .25s}.ad-prog span{position:relative}
.ad-steps{text-align:left;padding-left:20px;font-size:13.5px;line-height:1.6;margin:10px 0}.ad-steps code,.ad-uid code,.ad-card code{background:rgba(127,127,127,.18);padding:1px 6px;border-radius:6px;font-size:12.5px;word-break:break-all}
.ad-uid{display:flex;gap:8px;align-items:center;justify-content:space-between;text-align:left}
.ad-card details{margin-top:10px;font-size:13.5px}.ad-card summary{cursor:pointer;font-weight:600;color:var(--acc)}
.ad-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:60;padding:20px}.ad-dlg{border-radius:20px;padding:20px;max-width:360px;width:100%}.ad-dlg h3{margin-bottom:6px}.ad-dlg p{color:var(--mut);font-size:14px;margin-bottom:16px;line-height:1.5}.ad-dlg .btn{flex:1}
