<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100c"><title>APK Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Bengali:wght@400;700&display=swap">
<style>
:root{--bg:#f4ecdf;--ink:#2a2118;--mut:#7d6f5f;--card:rgba(255,251,243,.92);--line:rgba(60,40,20,.14);--acc:#2f7d5b;--acc2:#e8a33d;--shadow:0 18px 50px rgba(40,25,10,.25)}
body.night{--bg:#0d1224;--ink:#ece6d8;--mut:#9aa1b8;--card:rgba(20,26,48,.9);--line:rgba(255,255,255,.12);--acc:#5fc79a;--shadow:0 18px 50px rgba(0,0,0,.5)}
body.evening{--bg:#3a2218;--ink:#fbeedd;--mut:#d0b7a2;--card:rgba(58,34,24,.9);--line:rgba(255,220,180,.16);--acc:#f0b562}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#14100c;color:var(--ink);font-family:"DM Sans","Noto Sans Bengali",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
#top{position:fixed;left:16px;right:16px;top:14px;display:flex;gap:10px;align-items:center;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 8px;border-radius:999px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px 0 42px;font:inherit;outline:none;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:14px;top:12px;width:20px;height:20px;opacity:.55}
.sugg{position:absolute;top:50px;left:0;right:0;border-radius:16px;overflow:hidden;display:none}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px}
.sugg button:hover,.sugg button.on{background:rgba(127,127,127,.15)}
.sugg img{width:30px;height:30px;border-radius:8px;object-fit:cover}
.sp{flex:1}
.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.ibtn.on{background:var(--acc);color:#fff}
#chips{position:fixed;left:16px;right:16px;top:70px;display:flex;gap:8px;overflow-x:auto;z-index:4;padding:4px 0;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px)}
.chip.on{background:var(--ink);color:var(--bg)}
#presets{position:fixed;left:16px;bottom:16px;display:flex;gap:6px;z-index:4;padding:5px;border-radius:999px}
#presets button{padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mut)}
#presets button.on{background:var(--ink);color:var(--bg)}
#hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:12.5px;color:#fff;background:rgba(0,0,0,.45);padding:7px 14px;border-radius:999px;z-index:3;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#tip{position:fixed;z-index:6;pointer-events:none;padding:7px 11px;border-radius:12px;font-size:12.5px;font-weight:600;transform:translate(-50%,-130%);opacity:0;transition:opacity .15s;white-space:nowrap}
#tip small{display:block;font-weight:400;color:var(--mut)}
/* details */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:7;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-radius:24px 0 0 24px;border-right:0}
#panel.open{transform:none}
#panel .scroll{overflow-y:auto;flex:1;padding:18px 22px 110px;overscroll-behavior:contain}
.pclose{position:absolute;top:12px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(127,127,127,.18);font-size:18px}
.phead{display:flex;gap:16px;align-items:flex-end;margin-top:6px}
.phead img{width:92px;height:92px;border-radius:24px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.phead h2{font-size:24px;line-height:1.1;margin-bottom:4px}
.phead .dev{color:var(--acc);font-weight:600;font-size:13.5px}
.phead .tg{color:var(--mut);font-size:13px;margin-top:2px}
.stats{display:flex;margin:18px 0;padding:12px 0;border-block:1px solid var(--line)}
.stats div{flex:1;text-align:center;border-left:1px solid var(--line);padding:0 4px}
.stats div:first-child{border:0}
.stats b{display:block;font-size:15px}.stats span{font-size:11.5px;color:var(--mut)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(127,127,127,.16)}
.badge.g{background:var(--acc);color:#fff}.badge.o{background:var(--acc2);color:#2a1a05}
.shots{display:flex;gap:10px;overflow-x:auto;margin:0 -22px;padding:4px 22px 10px;scroll-snap-type:x mandatory}
.shots img{height:260px;width:auto;border-radius:16px;scroll-snap-align:start;cursor:zoom-in;box-shadow:0 6px 18px rgba(0,0,0,.2);background:rgba(127,127,127,.15)}
.sec{margin-top:22px}.sec h3{font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sec p,.sec li{font-size:14px;line-height:1.55;color:var(--ink);opacity:.9}
.sec ul{padding-left:18px}
.more{font-size:13px;color:var(--acc);font-weight:700}
.rate{display:flex;gap:18px;align-items:center}
.rate .big{font-size:46px;font-weight:700;line-height:1}
.bars{flex:1}.bars div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.bars i{flex:1;height:6px;border-radius:9px;background:rgba(127,127,127,.2);overflow:hidden}.bars u{display:block;height:100%;background:var(--acc);border-radius:9px}
.rev{padding:12px 0;border-bottom:1px solid var(--line)}
.rev .h{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.rev .h span{color:var(--mut);font-weight:400}
.stars{color:var(--acc2);letter-spacing:1px}
.write textarea,.write input{width:100%;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:rgba(127,127,127,.1);color:var(--ink);padding:10px;font:inherit}
.starpick button{font-size:26px;color:rgba(127,127,127,.4)}.starpick button.on{color:var(--acc2)}
.btn{padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;background:rgba(127,127,127,.18)}
.btn.main{background:var(--acc);color:#fff}
.info{width:100%;border-collapse:collapse;font-size:13.5px}.info td{padding:7px 0;border-bottom:1px solid var(--line)}.info td:first-child{color:var(--mut);width:42%}
.perm{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border-radius:10px;background:rgba(127,127,127,.15);font-size:12.5px}
.sim{display:flex;gap:12px;overflow-x:auto}.sim button{flex:0 0 76px;text-align:center;font-size:11.5px}.sim img{width:68px;height:68px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 4px}
#bar{position:absolute;left:0;right:0;bottom:0;padding:14px 22px 18px;display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,var(--card) 35%);border-radius:0 0 0 24px}
#bar .inst{flex:1;height:50px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;position:relative;overflow:hidden}
#bar .inst.done{background:rgba(127,127,127,.25);color:var(--ink)}
#bar .inst i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);width:0}
#bar .sq{width:50px;height:50px;border-radius:50%;background:rgba(127,127,127,.2);font-size:20px}
#bar .sq.on{background:#e0457b;color:#fff}
/* list view */
#list{position:fixed;inset:0;z-index:3;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(22px);display:none;overflow-y:auto;padding:130px 22px 90px}
#list.show{display:block}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;gap:14px;padding:14px;border-radius:20px;text-align:left;align-items:center;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card img{width:68px;height:68px;border-radius:18px;object-fit:cover;flex:none}
.card b{display:block;font-size:15px}.card span{display:block;font-size:12.5px;color:var(--mut)}
.sortbar{max-width:1100px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sortbar select{border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;font:inherit}
.empty{text-align:center;color:var(--mut);padding:60px 0;grid-column:1/-1}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);opacity:0;z-index:20;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.3s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:none;place-items:center}#lb.show{display:grid}#lb img{max-width:92vw;max-height:88vh;border-radius:18px}
#boot{position:fixed;inset:0;z-index:50;background:#14100c;color:#f0e4cf;display:grid;place-items:center;text-align:center;transition:opacity .8s}
#boot .ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#e8a33d;animation:sp 1s linear infinite;margin:0 auto 14px}@keyframes sp{to{rotate:360deg}}
@media(max-width:720px){
 #top{left:10px;right:10px;top:10px;gap:6px;flex-wrap:wrap}.logo span{display:none}.logo{padding:6px}.search{order:3;flex:1 0 100%;max-width:none}.sp{display:none}.search input{height:40px}.search svg{top:10px}
 .seg button{padding:7px 9px;font-size:12px}.ibtn{width:38px;height:38px;font-size:16px}.logo i{margin:0}#top{justify-content:space-between}.search+.seg{margin-left:0}
 #chips{top:112px;left:10px;right:10px}
 #panel{top:auto;height:64vh;width:100%;border-radius:24px 24px 0 0;transform:translateY(105%)}#panel.open{transform:none}#bar{border-radius:0}
 #presets{left:10px;bottom:10px;max-width:calc(100vw - 20px);overflow-x:auto}#hint{display:none}
 #list{padding-top:170px}
}

</style></head><body class="day">
<canvas id="c"></canvas>
<div id="top">
  <div class="logo glass"><i>▣</i><span id="storeName">APK Store</span></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" autocomplete="off" data-ph="search"><div class="sugg glass" id="sugg"></div></div>
  <div class="sp"></div>
  <div class="seg glass" id="viewSeg"><button data-v="shelf" class="on" data-t="shelf">Shelf</button><button data-v="list" data-t="list">All apps</button></div>
  <div class="seg glass" id="modeSeg"><button data-m="day" title="Day">☀️</button><button data-m="evening" title="Evening">🌇</button><button data-m="night" title="Night">🌙</button></div>
  <button class="ibtn glass" id="lang" title="Language">বা</button>
  <button class="ibtn glass" id="snd" title="Sound">🔊</button>
</div>
<div id="chips"></div>
<div id="presets" class="glass"></div>
<div id="hint" data-t="hint">Drag to look around · scroll to zoom · click an app</div>
<div id="tip" class="glass"></div>
<aside id="panel" class="glass"><button class="pclose" id="pclose">✕</button><div class="scroll" id="pbody"></div><div id="bar"></div></aside>
<section id="list"><div class="sortbar"><select id="sort"></select><button class="chip" id="fWish"></button><button class="chip" id="fInst"></button></div><div class="grid" id="grid"></div></section>
<div id="toast" class="glass"></div>
<div id="lb"><img alt=""></div>
<div id="boot"><div><div class="ring"></div><div id="bootT">Building your shelf…</div></div></div>

<script>window.__PREVIEW=false;window.__DATA=null;</script>
<script src="app.js"></script>
</body></html>
